# Railway runtime configuration for FindNord.
# Persistent volumes cannot be provisioned by railway.toml. In the Railway
# dashboard, add ONE volume to this service and mount it at /app/storage.
# Node 22 LTS is pinned in package.json/.nvmrc so better-sqlite3 can use its
# supported prebuilt binary instead of attempting a toolchain build on Node 24.

[build]
  builder = "RAILPACK"

[deploy]
  startCommand = "node scripts/server.js"
  healthcheckPath = "/"
  healthcheckTimeout = 300
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10

# Environment variables (set these in Railway dashboard, not here)
# Required for a production deployment:
# - NODE_ENV=production
# - DB_PATH=/app/storage/findnord.db
# - UPLOADS_DIR=/app/storage/uploads
# Railway injects PORT automatically; do not hard-code it.
#
# Optional features:
# - OPENAI_API_KEY (AI photo generation)
# - GOOGLE_CLIENT_ID (Google sign-in; no client secret is used)
# - ADMIN_EMAIL (admin access)
# - AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, SES_FROM_EMAIL (email)
# - SENTRY_DSN (error tracking)
# - STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, BOOST_PAYMENTS_ENABLED=true (Boost payments)
# - SEED_DEMO_DATA=true (sample data; leave unset in production)
